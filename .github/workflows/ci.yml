name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ticketpay_test
          POSTGRES_USER: ticketpay_test
          POSTGRES_PASSWORD: ticketpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketpay_test -d ticketpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ticketpay_test
      TEST_DATABASE_USER: ticketpay_test
      TEST_DATABASE_PASSWORD: ticketpay_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Run unit and integration tests
        run: mvn -B -ntp clean test

      - name: Create fresh bootstrap IT database
        run: |
          PGPASSWORD="$TEST_DATABASE_PASSWORD" psql \
            -h localhost \
            -U "$TEST_DATABASE_USER" \
            -d postgres \
            -c "CREATE DATABASE ticketpay_it OWNER $TEST_DATABASE_USER;"

      - name: Run administrator bootstrap PostgreSQL IT
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/ticketpay_it
        run: mvn -B -ntp -Dtest=AdminBootstrapPostgresIT test

      - name: Package application
        run: mvn -B -ntp -DskipTests package

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: ticketpay-jar
          path: target/ticketpay-*.jar
          if-no-files-found: error
