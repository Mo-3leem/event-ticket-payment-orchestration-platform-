spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ticketpay}
    username: ${DATABASE_USER:ticketpay}
    password: ${DATABASE_PASSWORD:ticketpay}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Never silently baseline a non-empty database: that can skip V1 and then
    # apply demo seed data. Provision an empty database or baseline explicitly.
    baseline-on-migrate: false
  task:
    scheduling:
      # Several independent recovery jobs share this scheduler. A single thread
      # would let one slow provider lookup block hold and booking expiry.
      pool:
        size: 4

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-for-dev-only-0123456789}
    expiration-minutes: 15
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  hold:
    ttl-minutes: 10
  payment:
    provider-timeout-ms: 5000
    key-ttl-hours: 24
    reclaim-after-seconds: 120
    cleanup-interval-ms: 3600000
  refund:
    provider-timeout-ms: 5000
    min-age-minutes: 10
    batch-size: 50
  reconciliation:
    min-age-minutes: 10
    batch-size: 50
    interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ticketpay: INFO
