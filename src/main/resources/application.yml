spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ticketpay}
    username: ${DATABASE_USER:ticketpay}
    password: ${DATABASE_PASSWORD:ticketpay}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-for-dev-only-0123456789}
    expiration-minutes: 15
  hold:
    ttl-minutes: 10
  payment:
    provider-timeout-ms: 5000
    key-ttl-hours: 24
    reclaim-after-seconds: 120
    cleanup-interval-ms: 3600000
  reconciliation:
    min-age-minutes: 10
    batch-size: 50
    interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ticketpay: INFO
