app:
  hold:
    ttl-minutes: 10
    expiry-check-ms: 3600000
  payment:
    provider-timeout-ms: 500
    key-ttl-hours: 24
    reclaim-after-seconds: 120
    cleanup-interval-ms: 3600000
  reconciliation:
    min-age-minutes: 10
    batch-size: 50
    interval-ms: 3600000

logging:
  level:
    com.ticketpay: INFO
    org.springframework.security: WARN
